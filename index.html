<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>Student Result Management</h1>
        <p>Enter your subject marks </p>

        <div class="form">
            <input type="number" id="subject1" placeholder="English Marks">
            <input type="number" id="subject2" placeholder="Mathematics Marks">
            <input type="number" id="subject3" placeholder="Computer Marks">
            <input type="number" id="subject4" placeholder="Physics Marks">
            <input type="number" id="subject5" placeholder="Urdu Marks">

            <button onclick="calculateResult()">Calculate Result</button>
        </div>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
